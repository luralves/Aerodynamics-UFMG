% TeX4ebook-only configuration for the Aerodynamics collection.
% This file does not affect pdfLaTeX or the shared aerodynamics.cls.
\Preamble{xhtml}
\AtBeginDocument{%
  % etoc's PDF-oriented \localtableofcontents does not generate useful
  % links in TeX4ht. Leave a semantic placeholder to be populated by
  % epub.py from the actual chapter/section anchors in the EPUB.
  \renewcommand{\ChapterTOC}{%
    \ifvmode\IgnorePar\fi\EndP
    \HCode{<div class="aero-chapter-toc-placeholder"></div>}%
    \par
  }%
}
\begin{document}
\Css{
.chapterHead, .likechapterHead {
  font-family: "Lato", "Arial", sans-serif;
  font-size: 1.85em;
  line-height: 1.25;
  font-weight: bold;
  color: \#202020;
  margin-top: 1.2em;
  margin-bottom: 0.8em;
}
.chapterHead .titlemark {
  display: block;
  font-family: "Arial", sans-serif;
  font-size: 0.50em;
  line-height: 1.45;
  font-weight: normal;
  color: \#555555;
  margin-bottom: 0.35em;
  letter-spacing: 0.04em;
}
.chapterHead br { display: none; }
.aero-local-toc {
  border-top: 1px solid \#aaaaaa;
  border-bottom: 1px solid \#dddddd;
  padding: 0.8em 0;
  margin: 1.1em 0 2em;
}
.aero-local-toc-title {
  font-size: 1em;
  font-weight: bold;
  margin: 0 0 0.65em;
  color: \#202020;
}
.aero-local-toc ol {
  margin: 0;
  padding-left: 0;
  list-style-type: none;
}
.aero-local-toc li {
  margin: 0.32em 0;
  line-height: 1.45;
}
.aero-local-toc a {
  color: inherit;
  text-decoration: none;
}
.aero-local-toc-number {
  display: inline-block;
  min-width: 2.4em;
  font-weight: bold;
}
}
\EndPreamble
